# ==============================
# Server Configuration
# ==============================
server.port=8080
server.servlet.context-path=/api

# ==============================
# MySQL Datasource Configuration
# Replace 'yourpassword' with your actual MySQL root password.
# NEVER commit real credentials to version control.
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/student_management_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Rahul@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA / Hibernate Configuration
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# ==============================
# Jackson
# ==============================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ==============================
# CORS handled in WebConfig.java (allows React dev server on 3000)
# ==============================

# ==============================
# Swagger / OpenAPI
# ==============================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==============================
# Logging
# ==============================
logging.level.com.pythonlife.sms=DEBUG
logging.level.org.hibernate.SQL=DEBUG
